name: Release

on:
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    # Skip version-bump commits from the local release script
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for tags and changelog

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0"
            PREV_TAG=""
          else
            CURRENT="${LATEST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_VERSION="${MAJOR}.$((MINOR + 1))"
            PREV_TAG="$LATEST_TAG"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_VERSION"

      - name: Build release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project PositronWatchers.xcodeproj \
            -scheme PositronWatchers \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Create DMG
        run: |
          APP_PATH=$(find build -name "PositronWatchers.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find PositronWatchers.app"
            exit 1
          fi

          mkdir -p build/dmg-staging
          cp -R "$APP_PATH" build/dmg-staging/
          ln -s /Applications build/dmg-staging/Applications

          hdiutil create -volname "PositronWatchers" \
            -srcfolder build/dmg-staging \
            -ov -format UDZO \
            PositronWatchers.dmg

      - name: Generate release notes
        id: notes
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" \
              | grep -v "chore: bump version" || true)
          else
            NOTES=$(git log --pretty=format:"- %s" \
              | grep -v "chore: bump version" || true)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          # Write to file to preserve newlines
          echo "$NOTES" > release-notes.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" PositronWatchers.dmg \
            --title "PositronWatchers v$VERSION" \
            --notes-file release-notes.txt
